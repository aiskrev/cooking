# Продукция на VPS (без dev/qa услуги). Пуска се от /opt/recipes:
#   docker compose -f docker-compose.prod.yml up -d
# Образът „recipes-cms:prod“ се сглобява локално и се качва на сървъра (на сървъра няма swap – тежките сглобявания не се правят там).
name: recipes
services:
  web:
    image: caddy:2-alpine
    ports: ["127.0.0.1:8081:8080"]   # само за Caddy на хоста и за SSH тунел; не е публикуван на интернет
    volumes:
      - ./deploy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - releases:/srv:ro
    depends_on: [cms]
    restart: unless-stopped
    mem_limit: 128m

  cms:
    image: recipes-cms:prod
    environment:
      SITE_URL: https://recipes.ai-commercestudio.com
      INDEXABLE: ""                 # сайтът остава неиндексируем (noindex), докато собственикът не реши друго
      CMS_COOKIE_SECURE: auto
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      # Писма за профилите (потвърждаване на имейл, нова парола). Докато не се зададат, регистрацията връща „временно не е налична“.
      # Стойностите (с паролата за SMTP) се пазят в /opt/recipes/.env на сървъра – никога в Git.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-disabled}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_SECURE: ${MAIL_SMTP_SECURE:-}
      MAIL_SMTP_USER: ${MAIL_SMTP_USER:-}
      MAIL_SMTP_PASS: ${MAIL_SMTP_PASS:-}
    volumes:
      - cms-data:/data
      - releases:/releases
      - astro-cache:/app/node_modules/.astro
      - ./src/content/recipes:/app/src/content/recipes
      - ./src/assets/site:/app/src/assets/site:ro
    expose: ["3000"]
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  cms-data:
  releases:
  astro-cache:
